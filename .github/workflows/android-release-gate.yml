name: Android release gate

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify JVM tests, lint and build artifacts
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:assembleDebugAndroidTest

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 32, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Create API ${{ matrix.api-level }} emulator
        run: |
          chmod +x gradlew
          sudo chmod 666 /dev/kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "newaudio-ci-${{ matrix.api-level }}" \
            --package "system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "newaudio-ci-${{ matrix.api-level }}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Run instrumentation and migration tests
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest

name: Android release gate

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify JVM tests, lint and build artifacts
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -Pnewaudio.composeCompilerReports=true \
            :app:testDebugUnitTest \
            :app:testBenchmarkUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:assembleDebugAndroidTest \
            :app:assembleBenchmark \
            :benchmark:assembleBenchmark \
            cyclonedxBom
      - name: Verify benchmark tooling is absent from release
        shell: pwsh
        run: ./performance/scripts/verify-release-isolation.ps1
      - name: Verify performance host tools
        shell: pwsh
        run: |
          ./benchmark/tools/generate-fixtures.ps1 -Check
          ./performance/scripts/verify-provenance-contract.ps1
          ./performance/scripts/verify-runner-contracts.ps1
          ./performance/scripts/normalize-metrics.ps1 -SelfTest
          ./performance/scripts/aggregate-series.ps1 -SelfTest
          ./performance/scripts/compare-baseline.ps1 -SelfTest
          ./performance/scripts/summarize-trace.ps1 -SelfTest
      - name: Reject tracked secrets and signing material
        shell: pwsh
        run: ./performance/scripts/verify-repository-hygiene.ps1
      - name: Scan repository history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.27.2
        with:
          args: detect --source=/github/workspace --redact --no-banner --exit-code=1
      - name: Stage resolved Gradle dependency SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force performance/results/ci | Out-Null
          Copy-Item build/reports/cyclonedx/bom.json performance/results/ci/newaudio-sbom.cdx.json
      - name: Scan generated SBOM for known vulnerabilities
        uses: anchore/scan-action@v7
        with:
          sbom: performance/results/ci/newaudio-sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: performance/results/ci/grype-report.json
          cache-db: false
      - name: Upload SBOM, vulnerability database evidence and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newaudio-build-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            performance/results/ci/newaudio-sbom.cdx.json
            performance/results/ci/grype-report.json
            app/build/reports/compose-compiler/**
      - name: Review dependency vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 32, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Create API ${{ matrix.api-level }} emulator
        env:
          ANDROID_CMDLINE_TOOLS_BUILD: "15859902"
          ANDROID_CMDLINE_TOOLS_SHA1: "040d3996a65543d22ec4bf73e4c37aa37a8d4af4"
        run: |
          chmod +x gradlew
          sudo chmod 666 /dev/kvm
          cmdline_archive="$RUNNER_TEMP/commandlinetools-linux.zip"
          cmdline_root="$RUNNER_TEMP/android-cmdline-tools"
          curl --fail --location --retry 3 \
            --output "$cmdline_archive" \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_BUILD}_latest.zip"
          echo "${ANDROID_CMDLINE_TOOLS_SHA1}  ${cmdline_archive}" | sha1sum --check --strict
          unzip -q "$cmdline_archive" -d "$cmdline_root"
          sdkmanager="$cmdline_root/cmdline-tools/bin/sdkmanager"
          avdmanager="$cmdline_root/cmdline-tools/bin/avdmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$HOME/.android/avd"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          printf 'no\n' | "$avdmanager" create avd \
            --force \
            --name "newaudio-ci-${{ matrix.api-level }}" \
            --package "system-images;android-${{ matrix.api-level }};google_apis;x86_64" \
            --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds | \
            grep -Fqx "newaudio-ci-${{ matrix.api-level }}"
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "newaudio-ci-${{ matrix.api-level }}" \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader > /tmp/emulator.log 2>&1 &
          emulator_pid=$!
          for boot_attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator stopped before Android finished booting."
              cat /tmp/emulator.log
              exit 1
            fi
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$boot_attempt" -eq 150 ]; then
              echo "Timed out waiting five minutes for Android to boot."
              cat /tmp/emulator.log
              exit 1
            fi
            sleep 2
          done
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
      - name: Run instrumentation and migration tests
        env:
          ANDROID_SERIAL: emulator-5554
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest
